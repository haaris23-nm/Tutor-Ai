# Server Port Settings
server.port=8080

# H2 Connected Database configuration (In-Memory for painless out-of-the-box local runs)
spring.datasource.url=jdbc:h2:mem:tutor_ai_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Web Console Access (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Gemini API configuration setup
gemini.api.key=${GEMINI_API_KEY:offline_fallback_key}
